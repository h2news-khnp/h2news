<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>KHNP H2 News Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="수소·에너지 뉴스를 매일 수집해 날짜와 키워드로 찾아보는 아카이브.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --blue:#0054A6; --blue-ink:#00407e;
  --bg:#ffffff; --bg-alt:#f7f8fa;
  --ink:#111827; --sub:#6b7280; --faint:#9aa1ab;
  --line:#edeff2; --line-2:#e8eaed; --rule:#1f2937;
  --field:#ffffff; --field-line:#d5d8dd;
  --chip-bg:#e7f0fa; --chip-line:#cfe0f2; --chip-ink:#00407e;
  --tag-bg:#f1f3f5; --tag-ink:#4b5563;
  --src-a-bg:#e7f0fa; --src-a-ink:#00407e;
  --src-b-bg:#fbf0dd; --src-b-ink:#7a4a00;
  --src-c-bg:#ddf1ed; --src-c-ink:#0b5c53;
}
@media (prefers-color-scheme: dark){
  :root{
    --blue:#0b3f77; --blue-ink:#9ec5f0;
    --bg:#101418; --bg-alt:#161b21;
    --ink:#e8eaed; --sub:#a3abb5; --faint:#767e88;
    --line:#242a31; --line-2:#242a31; --rule:#3d4650;
    --field:#1a2027; --field-line:#323a43;
    --chip-bg:#16304d; --chip-line:#20456e; --chip-ink:#9ec5f0;
    --tag-bg:#1c2229; --tag-ink:#b2bac3;
    --src-a-bg:#16304d; --src-a-ink:#9ec5f0;
    --src-b-bg:#3a2e17; --src-b-ink:#e0bd7c;
    --src-c-bg:#14332e; --src-c-ink:#82ccbe;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 헤더 ── */
header{background:var(--blue);position:sticky;top:0;z-index:20}
.head-in{padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-l{display:flex;align-items:center;gap:8px;min-width:0}
.brand-l img{width:22px;height:22px;object-fit:contain;flex-shrink:0}
.brand-fb{width:22px;height:22px;border:1.5px solid rgba(255,255,255,.75);border-radius:3px;
  display:none;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.brand-l h1{margin:0;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px;white-space:nowrap}
.count{font-size:11px;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 10px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:6px}
.search svg{flex-shrink:0}
.search input{flex:1 1 auto;min-width:0;height:100%;background:transparent;border:0;outline:0;
  color:#fff;font-size:14px}
.search input::placeholder{color:rgba(255,255,255,.62)}
.search button{height:28px;padding:0 11px;border:0;border-radius:4px;background:#fff;
  color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}

/* ── TOP 3 ── */
.topkw{background:var(--bg-alt);border-bottom:1px solid var(--line-2)}
.topkw-in{padding:10px 16px;display:flex;align-items:center;gap:8px}
.topkw h2{margin:0;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.3px;white-space:nowrap}
.topkw-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:26px;padding:0 9px;border:1px solid var(--chip-line);border-radius:3px;
  background:var(--chip-bg);color:var(--chip-ink);font-size:11px;font-weight:600;cursor:pointer}

/* ── 필터 ── */
.filters{border-bottom:2px solid var(--rule)}
.filters-in{padding:9px 16px;display:flex;gap:8px;align-items:center}
.filters select{flex:1 1 0;min-width:0;height:34px;padding:0 6px;border:1px solid var(--field-line);
  border-radius:4px;background:var(--field);color:var(--ink);font-size:12px}
.filters button{height:34px;padding:0 10px;border:1px solid var(--field-line);border-radius:4px;
  background:var(--field);color:var(--sub);font-size:12px;cursor:pointer;flex-shrink:0}

/* ── 기사 목록 ── */
.state{padding:48px 16px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7}
.state strong{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
article{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.meta{display:flex;align-items:center;gap:7px}
.src{font-size:10px;font-weight:700;padding:2px 5px;border-radius:2px;white-space:nowrap}
.src-a{background:var(--src-a-bg);color:var(--src-a-ink)}
.src-b{background:var(--src-b-bg);color:var(--src-b-ink)}
.src-c{background:var(--src-c-bg);color:var(--src-c-ink)}
.date{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.spacer{flex:1 1 auto}
.share{width:32px;height:32px;margin:-4px -6px -4px 0;border:0;background:transparent;padding:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.title{font-size:14.5px;font-weight:600;line-height:1.38;color:var(--ink);
  text-decoration:none;letter-spacing:-.3px}
.title:hover{color:var(--blue-ink);text-decoration:underline}
.summary{font-size:12px;color:var(--sub);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
.tag{font-size:10px;color:var(--tag-ink);background:var(--tag-bg);border:0;border-radius:2px;
  padding:4px 6px;cursor:pointer}
#sentinel{height:1px}
.more{padding:20px 16px 44px;text-align:center;color:var(--faint);font-size:12px}
footer{padding:20px 16px 36px;text-align:center;color:var(--faint);font-size:11px;line-height:1.7}

/* ── 토스트 ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;
  background:rgba(17,24,39,.9);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;
  z-index:50;display:none}
@media (min-width:640px){
  .head-in,.topkw-in,.filters-in{padding-left:20px;padding-right:20px}
  article{padding-left:20px;padding-right:20px}
}
</style>
</head>
<body>

<header>
  <div class="wrap head-in">
    <div class="brand">
      <div class="brand-l">
        <img src="assets/khnp_logo.png" alt="" id="logo">
        <span class="brand-fb" id="logoFb" aria-hidden="true">KH</span>
        <h1>H2 News Archive</h1>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label class="sr" for="q">기사 검색</label>
      <input id="q" type="search" placeholder="제목, 요약, 태그 검색" autocomplete="off">
      <button type="button" id="go">검색</button>
    </div>
  </div>
</header>

<section class="topkw" id="topkw" hidden>
  <div class="wrap topkw-in">
    <h2>TOP 3</h2>
    <div class="topkw-chips" id="chips"></div>
  </div>
</section>

<section class="filters">
  <div class="wrap filters-in">
    <label class="sr" for="dateFilter">날짜</label>
    <select id="dateFilter"><option value="all">날짜: 전체</option></select>
    <label class="sr" for="tagFilter">태그</label>
    <select id="tagFilter"><option value="all">태그: 전체</option></select>
    <button type="button" id="reset">초기화</button>
  </div>
</section>

<main class="wrap">
  <div id="list"></div>
  <div id="sentinel"></div>
  <p class="state" id="state">기사를 불러오는 중입니다.</p>
</main>

<footer class="wrap">
  수집: 에너지신문 · 가스신문 · 전기신문<br>
  각 기사의 저작권은 해당 언론사에 있습니다.
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var DATA = 'data';
  var PRIORITY = ['에너지신문', '가스신문', '전기신문'];
  var SRC_CLASS = { '전기신문': 'src-a', '에너지신문': 'src-b', '가스신문': 'src-c' };
  var PAGE = 30;

  var el = {
    list: document.getElementById('list'),
    state: document.getElementById('state'),
    sentinel: document.getElementById('sentinel'),
    count: document.getElementById('count'),
    topkw: document.getElementById('topkw'),
    chips: document.getElementById('chips'),
    q: document.getElementById('q'),
    go: document.getElementById('go'),
    reset: document.getElementById('reset'),
    dateFilter: document.getElementById('dateFilter'),
    tagFilter: document.getElementById('tagFilter'),
    toast: document.getElementById('toast')
  };

  var index = null;      // { dates:[[날짜, 건수]], tags:[], total }
  var dayCache = {};     // 날짜 -> 기사 배열
  var corpus = null;     // 전체 기간 검색용 (처음 필요할 때만 받음)
  var corpusReq = null;
  var legacy = false;    // index.json이 없으면 all.json으로 동작

  var keyword = '';
  var view = [];
  var shown = 0;

  /* ── 유틸 ── */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(a) {
    return {
      date: a.date || a.d || '',
      source: a.source || a.s || '',
      title: a.title || a.t || '',
      url: a.url || a.u || '',
      subtitle: a.subtitle || a.b || '',
      tags: Array.isArray(a.tags) ? a.tags : (Array.isArray(a.g) ? a.g : [])
    };
  }
  function haystack(a) {
    if (a._h === undefined) {
      a._h = (a.title + ' ' + a.subtitle + ' ' + a.tags.join(' ')).toLowerCase();
    }
    return a._h;
  }
  function sortArticles(list) {
    return list.slice().sort(function (a, b) {
      // 날짜 내림차순이 먼저. 같은 날 안에서만 태그 수 -> 출처 -> 제목 순.
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      if (b.tags.length !== a.tags.length) return b.tags.length - a.tags.length;
      var ra = PRIORITY.indexOf(a.source), rb = PRIORITY.indexOf(b.source);
      ra = ra < 0 ? 99 : ra; rb = rb < 0 ? 99 : rb;
      if (ra !== rb) return ra - rb;
      return String(a.title).localeCompare(String(b.title), 'ko');
    });
  }
  function getJSON(path) {
    return fetch(path).then(function (r) {
      if (!r.ok) throw new Error(path + ' (' + r.status + ')');
      return r.json();
    });
  }
  var toastTimer;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.style.display = 'none'; }, 1600);
  }
  function setState(html) {
    el.state.innerHTML = html;
    el.state.hidden = !html;
  }

  /* ── 데이터 ── */
  function loadDay(date) {
    if (dayCache[date]) return Promise.resolve(dayCache[date]);
    if (legacy) {
      return ensureCorpus().then(function (all) {
        dayCache[date] = all.filter(function (a) { return a.date === date; });
        return dayCache[date];
      });
    }
    return getJSON(DATA + '/by_date/' + date + '.json').then(function (rows) {
      dayCache[date] = rows.map(norm);
      return dayCache[date];
    });
  }

  function ensureCorpus() {
    if (corpus) return Promise.resolve(corpus);
    if (corpusReq) return corpusReq;
    corpusReq = getJSON(DATA + '/search.json')
      .catch(function () { return getJSON(DATA + '/all.json'); })
      .then(function (rows) {
        corpus = rows.map(norm);
        return corpus;
      });
    return corpusReq;
  }

  /* ── 필터 채우기 ── */
  function fillOptions(dates, tags) {
    var df = document.createDocumentFragment();
    dates.forEach(function (d) {
      var o = document.createElement('option');
      o.value = d[0];
      o.textContent = d[1] ? d[0] + ' (' + d[1] + ')' : d[0];
      df.appendChild(o);
    });
    el.dateFilter.appendChild(df);

    var tf = document.createDocumentFragment();
    tags.forEach(function (t) {
      var o = document.createElement('option');
      o.value = t; o.textContent = t;
      tf.appendChild(o);
    });
    el.tagFilter.appendChild(tf);
  }

  /* ── 렌더 ── */
  function rowHTML(a) {
    var cls = SRC_CLASS[a.source] || 'src-a';
    var tags = a.tags.slice(0, 5).map(function (t) {
      return '<button type="button" class="tag" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');
    return '<article>' +
      '<div class="meta">' +
        '<span class="src ' + cls + '">' + esc(a.source) + '</span>' +
        '<span class="date">' + esc(a.date) + '</span>' +
        '<span class="spacer"></span>' +
        '<button type="button" class="share" data-share="' + esc(a.url) + '" aria-label="링크 공유">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 10.8l7.2-4.1M8.4 13.2l7.2 4.1"/></svg>' +
        '</button>' +
      '</div>' +
      '<a class="title" href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.title) + '</a>' +
      (a.subtitle ? '<p class="summary">' + esc(a.subtitle) + '</p>' : '') +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
    '</article>';
  }

  function renderPage() {
    var slice = view.slice(shown, shown + PAGE);
    if (!slice.length) return;
    var html = [];
    for (var i = 0; i < slice.length; i++) html.push(rowHTML(slice[i]));
    el.list.insertAdjacentHTML('beforeend', html.join(''));
    shown += slice.length;
  }

  function renderTop(scope) {
    var counter = {};
    scope.forEach(function (a) {
      a.tags.forEach(function (t) { counter[t] = (counter[t] || 0) + 1; });
    });
    var top = Object.keys(counter).sort(function (x, y) {
      return counter[y] - counter[x] || x.localeCompare(y, 'ko');
    }).slice(0, 3);

    if (!top.length) { el.topkw.hidden = true; return; }
    el.topkw.hidden = false;
    el.chips.innerHTML = top.map(function (t) {
      return '<button type="button" class="chip" data-tag="' + esc(t) + '">' +
        esc(t) + ' ' + counter[t] + '</button>';
    }).join('');
  }

  /* ── 필터 적용 ── */
  function applyFilters() {
    var dateVal = el.dateFilter.value;
    var tagVal = el.tagFilter.value;
    var kw = keyword.toLowerCase().trim();
    var needAll = !!kw || dateVal === 'all';

    setState('불러오는 중입니다.');
    var source = needAll ? ensureCorpus() : loadDay(dateVal);

    source.then(function (rows) {
      var scope = rows;
      if (dateVal !== 'all') {
        scope = rows.filter(function (a) { return a.date === dateVal; });
      }
      renderTop(scope);

      view = scope.filter(function (a) {
        if (tagVal !== 'all' && a.tags.indexOf(tagVal) === -1) return false;
        if (kw && haystack(a).indexOf(kw) === -1) return false;
        return true;
      });
      view = sortArticles(view);

      el.list.innerHTML = '';
      shown = 0;

      if (!view.length) {
        setState('<strong>찾는 기사가 없습니다.</strong>다른 키워드나 날짜로 바꿔보세요.');
        return;
      }
      setState('');
      renderPage();
    }).catch(function (e) {
      el.list.innerHTML = '';
      setState('<strong>데이터를 불러오지 못했습니다.</strong>' + esc(e.message));
    });
  }

  function commitSearch() {
    keyword = el.q.value || '';
    if (keyword.trim()) el.dateFilter.value = 'all';
    applyFilters();
  }

  /* ── 공유 ── */
  function share(url) {
    if (navigator.share) {
      navigator.share({ url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(url).then(function () {
        toast('링크를 복사했습니다.');
      }, function () { toast('복사가 지원되지 않습니다.'); });
      return;
    }
    var ta = document.createElement('textarea');
    ta.value = url;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('링크를 복사했습니다.'); }
    catch (e) { toast('복사가 지원되지 않습니다.'); }
    document.body.removeChild(ta);
  }

  /* ── 이벤트 ── */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tag]');
    if (t) {
      el.tagFilter.value = t.getAttribute('data-tag');
      applyFilters();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var s = e.target.closest('[data-share]');
    if (s) share(s.getAttribute('data-share'));
  });

  el.go.addEventListener('click', commitSearch);
  el.q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); commitSearch(); }
  });
  el.dateFilter.addEventListener('change', applyFilters);
  el.tagFilter.addEventListener('change', applyFilters);
  el.reset.addEventListener('click', function () {
    el.q.value = '';
    keyword = '';
    el.tagFilter.value = 'all';
    if (index && index.dates.length) el.dateFilter.value = index.dates[0][0];
    applyFilters();
  });

  document.getElementById('logo').addEventListener('error', function () {
    this.style.display = 'none';
    document.getElementById('logoFb').style.display = 'flex';
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) renderPage();
    }, { rootMargin: '600px' }).observe(el.sentinel);
  }

  /* ── 시작 ── */
  getJSON(DATA + '/index.json')
    .then(function (idx) {
      index = idx;
      fillOptions(idx.dates, idx.tags);
      el.count.textContent = idx.total.toLocaleString() + '건 · ' + idx.dates.length + '일';
      el.dateFilter.value = idx.dates[0][0];
      applyFilters();
    })
    .catch(function () {
      // index.json이 아직 없으면 all.json 하나로 예전처럼 동작
      legacy = true;
      return ensureCorpus().then(function (all) {
        var dates = {}, tags = {};
        all.forEach(function (a) {
          if (a.date) dates[a.date] = (dates[a.date] || 0) + 1;
          a.tags.forEach(function (t) { tags[t] = 1; });
        });
        var dl = Object.keys(dates).sort().reverse().map(function (d) { return [d, dates[d]]; });
        index = { dates: dl, tags: Object.keys(tags).sort(function (a, b) { return a.localeCompare(b, 'ko'); }), total: all.length };
        fillOptions(index.dates, index.tags);
        el.count.textContent = index.total.toLocaleString() + '건 · ' + index.dates.length + '일';
        if (dl.length) el.dateFilter.value = dl[0][0];
        applyFilters();
      });
    })
    .catch(function (e) {
      setState('<strong>데이터를 불러오지 못했습니다.</strong>' + esc(e.message));
    });
})();
</script>
</body>
</html>
